[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "C4", "I"]
ignore = [
    # B008: "function call in default argument" — đây là cách FastAPI's
    # Depends() hoạt động, không phải bug. Toàn bộ hệ sinh thái FastAPI
    # tắt rule này.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "C408"]  # assert, chuỗi "password"-like, dict() style
# Bảng dữ liệu mẫu căn cột theo chủ đích để dễ đọc — không bẻ dòng.
"seed_demo.py" = ["E501"]
"migrations/versions/*.py" = ["E501"]  # sinh tự động bởi alembic
