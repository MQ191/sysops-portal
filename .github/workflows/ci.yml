name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Bài học từ lần bàn giao trước: 20/20 unit test allocator xanh trong khi
  # /api/v1/ipam/suggest trả lỗi 500. Bộ test tích hợp chạy TRÊN CẢ HAI
  # dialect — SQLite là nơi lỗi lệch tzinfo và khoá chính từng bị bỏ sót,
  # Postgres là môi trường production thật.
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Kiểm tra migration round-trip (up/down/up, không lệch schema)
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: pytest (SQLite)
        env:
          AUTH_MODE: dev
        run: pytest tests/ -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sysops_test
          POSTGRES_USER: sysops
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Kiểm tra migration trên Postgres thật (kể cả index GiST)
        env:
          DATABASE_URL: postgresql+psycopg://sysops:ci_test_only@localhost:5432/sysops_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      # TEST_DATABASE_URL chứ không phải DATABASE_URL: conftest chỉ chấp nhận
      # biến chuyên dụng này, vì bộ test xoá sạch bảng giữa các bài và không
      # được phép vô tình chạy trên DB thật.
      - name: pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sysops:ci_test_only@localhost:5432/sysops_test
          AUTH_MODE: dev
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-sqlite, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build image và xác nhận .dockerignore chặn secret
        run: |
          docker build -t sysops-portal:ci .
          # Bằng chứng chủ động: nếu vault_import.csv hay .env lọt vào image,
          # build này phải đỏ — không chỉ dựa vào .dockerignore mà tin suông.
          echo "fake-secret-for-ci-check" > vault_import.csv
          docker build -t sysops-portal:ci-check .
          if docker run --rm sysops-portal:ci-check sh -c "test -f /app/vault_import.csv"; then
            echo "LỖI: vault_import.csv lọt vào image"; exit 1
          fi
          rm -f vault_import.csv
          echo "OK: .dockerignore chặn được secret"
